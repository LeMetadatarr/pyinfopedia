[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyinfopedia"
dynamic = ["version"]
description = "Typed Python client for Infopédia — the Portuguese language dictionary (www.infopedia.pt/dicionarios/lingua-portuguesa)"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "JarbasAi", email = "jarbasai@mailfence.com" }]
requires-python = ">=3.9"
dependencies = ["requests>=2.28", "beautifulsoup4>=4.11", "unblock_requests"]
keywords = ["infopedia", "portuguese", "dictionary", "lexicon", "scraper", "nlp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Internet :: WWW/HTTP",
]

[project.optional-dependencies]
stealth = ["curl-cffi"]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/LeMetadatarr/pyinfopedia"
Repository = "https://github.com/LeMetadatarr/pyinfopedia"

[tool.pytest.ini_options]
markers = ["live: hits the live Infopédia API (network required)"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pyinfopedia*"]

[tool.setuptools.dynamic]
version = {attr = "pyinfopedia.version.__version__"}
